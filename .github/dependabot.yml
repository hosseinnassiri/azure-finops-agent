version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directories:
      - /
      - /plugins/roastbot-full/app
      - /plugins/roastbot-full/mcp
    schedule:
      interval: weekly
    ignore:
      # Azure MCP tool names change between releases: bump it by hand in all pin locations (see CLAUDE.md)
      - dependency-name: msmcp-azure
    groups:
      python:
        patterns: ["*"]

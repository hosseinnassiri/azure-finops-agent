name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # rerun a release by hand, e.g. after a push raced the release job

# Actions are pinned to commit SHAs (Dependabot keeps them current): the release job can push to main.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --locked --all-extras
      - run: uv lock --check --project plugins/roastbot/app
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  # Publishes the Claude Code plugin. Both marketplaces read this repo, so "publish" means: bump the version (users
  # only get a new plugin copy when it changes), copy the read-only scan/report code into plugins/roastbot/app (the
  # skill runs that bundle), tag v<version> and fast-forward the `release` branch (what Anthropic's directory
  # tracks). See CLAUDE.md "Releases".
  release:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Decide what to release
        id: plan
        run: |
          version=$(sed -nE 's/^version = "(.+)"/\1/p' pyproject.toml)
          if ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            action=tag    # bumped by hand, or never released: release this version as is
          elif git diff --quiet "v$version" HEAD -- plugins roastbot .claude-plugin pyproject.toml uv.lock; then
            action=none   # only docs, tests or CI changed: nothing a user would receive
          else
            action=bump
          fi
          echo "v$version -> $action"
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Bump the version and sync the plugin's bundle
        if: steps.plan.outputs.action != 'none'
        run: |
          if [ "${{ steps.plan.outputs.action }}" = bump ]; then how=patch; else how=--sync; fi
          version=$(uv run --no-project python scripts/bump_version.py $how)
          git add -A plugins pyproject.toml uv.lock
          git diff --cached --quiet || git commit -m "Release v$version [skip ci]"

      - name: Validate the release
        if: steps.plan.outputs.action != 'none'
        env:
          ROASTBOT_RELEASE: "1" # also checks that the bundle matches the source
        run: |
          uv sync --locked --all-extras
          uv lock --check --project plugins/roastbot/app
          uv run pytest -q tests/test_plugin.py
          npx -y @anthropic-ai/claude-code@2.1.322 plugin validate --strict .
          npx -y @anthropic-ai/claude-code@2.1.322 plugin validate --strict plugins/roastbot
          cd "$(mktemp -d)" && uv run --locked --no-editable --isolated --project "$GITHUB_WORKSPACE/plugins/roastbot/app" roastbot --help

      - name: Tag, push and create the GitHub release
        if: steps.plan.outputs.action != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE 's/^version = "(.+)"/\1/p' pyproject.toml)
          git tag -a "v$version" -m "RoastBot $version"
          git push origin HEAD:main "v$version"   # fails if main moved meanwhile; the next push releases it
          git push origin HEAD:release
          gh release create "v$version" --title "RoastBot $version" --generate-notes

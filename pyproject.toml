[project]
name = "roastbot"
version = "0.2.0"
description = "Rude, sarcastic Azure FinOps agent: finds cloud waste and roasts whoever owns it"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1",
    "azure-identity>=1.17",
    "azure-mgmt-resourcegraph>=8.0",
    "requests>=2.31",
]

[project.scripts]
roastbot = "roastbot.cli:main"

[project.optional-dependencies]
guard = [
    "typesafe-sdk>=0.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # long prompt and HTML strings are intentional
    "W191",  # we indent with tabs (ruff's formatter enforces it)
]

[tool.pytest.ini_options]
testpaths = ["tests"]

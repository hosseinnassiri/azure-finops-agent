[project]
name = "roastbot"
version = "0.2.4"
description = "Rude, sarcastic Azure FinOps agent: finds cloud waste and roasts whoever owns it"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Hossein Nassiri" }]
keywords = ["azure", "finops", "cloud-cost", "waste", "claude", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "claude-agent-sdk>=0.1",
    "azure-identity>=1.17",
    "azure-mgmt-resourcegraph>=8.0",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/hosseinnassiri/azure-finops-agent"
Repository = "https://github.com/hosseinnassiri/azure-finops-agent"
Issues = "https://github.com/hosseinnassiri/azure-finops-agent/issues"

[project.scripts]
roastbot = "roastbot.cli:main"

[project.optional-dependencies]
guard = [
    "typesafe-sdk>=0.7.2",
]
openai = [
    "openai>=3.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["roastbot", "tests", "README.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # long prompt and HTML strings are intentional
    "W191",  # we indent with tabs (ruff's formatter enforces it)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
